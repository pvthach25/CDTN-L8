services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DEMO_ONLY_CHANGE_BEFORE_DEPLOY_2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartcrm}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-smart_crm_l8}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_crm_l8}
      POSTGRES_USER: ${POSTGRES_USER:-smartcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./database/migrations/002_create_auth_tables.sql:/docker-entrypoint-initdb.d/02_create_auth_tables.sql:ro
      - ./database/migrations/003_add_survey_owner.sql:/docker-entrypoint-initdb.d/02b_add_survey_owner.sql:ro
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/03_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
